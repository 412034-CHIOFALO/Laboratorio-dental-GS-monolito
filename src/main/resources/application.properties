spring.application.name=monolito
server.port=8080
spring.profiles.active=dev
# nginx termina el TLS y manda X-Forwarded-Proto/-For — sin esto, Spring ve
# todo como HTTP plano interno y nunca sabe que la conexión real es HTTPS
# (afecta a los headers de seguridad de SecurityHeaders y a cualquier URL que
# se arme con el scheme/host del request).
server.forward-headers-strategy=framework

# --- Base de datos -----------------------------------------------------------
# Un solo DataSource para los 5 schemas (uno por dominio, ver
# docker-entrypoint-initdb.d/init-schemas.sql). Cada @Entity declara su propio
# @Table(schema = "gs_xxx"); el schema de esta URL es solo el "default" de la
# conexión, no limita a qué schemas se puede acceder.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gs_auth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
# NUNCA root acá: el usuario real (gs_app) lo crea solo
# docker-entrypoint-initdb.d/init-schemas.sh con GRANTs acotados a los 5
# schemas gs_* (ver .env.example). Corriendo fuera de Docker (mvn
# spring-boot:run contra un MySQL local), hay que crear ese usuario a mano o
# exportar DB_USERNAME/DB_PASSWORD apuntando a una cuenta que sí tenga acceso.
spring.datasource.username=${DB_USERNAME:gs_app}
spring.datasource.password=${DB_PASSWORD:gs_app}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "update" queda prendido A PROPÓSITO, conviviendo con Flyway — no es un
# descuido. Probado en los hechos: con "none" o "validate", el SQL de las
# queries reales pierde el prefijo de schema por completo (Hibernate ejecuta
# "select count(*) from pedidos" en vez de "...from gs_pedidos.pedidos", y
# rompe con "table doesn't exist") — Hibernate 6 necesita correr su propio
# SchemaManagementTool al menos una vez para resolver bien los catálogos
# cruzados de MySQL que este diseño (5 bases, un solo DataSource) requiere.
# Con Flyway ya creando el esquema exacto, "update" no debería tener nunca
# nada real que actualizar — pero es una red de seguridad, no el dueño: la
# disciplina real es que todo cambio de esquema se escribe como migración
# Flyway nueva (V2, V3...), nunca confiar en que "update" lo complete solo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Flyway: versiona el esquema real (ver nota de ddl-auto arriba) ---------
# baseline-on-migrate: si una base ya tiene las tablas (instalación previa a
# Flyway) pero no la tabla flyway_schema_history, marca V1 como aplicada sin
# volver a correrla, en vez de fallar. Bases nuevas corren V1 normal.
spring.flyway.enabled=true
spring.flyway.schemas=gs_auth,gs_catalogo,gs_pedidos,gs_finanzas,gs_stock
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- Authorization Server (módulo auth) ---------------------------------------
spring.security.oauth2.authorizationserver.issuer=${AUTH_ISSUER:http://localhost:8080}

# --- RSA Keystore para firma persistente de JWT -------------------------------
# file: (no classpath:) a propósito — ya no se versiona el .p12 real en git.
# Si no existe en este path, se genera solo al arrancar (ver JwtBeans). En el
# VPS, GS_KEYSTORE_PATH debe apuntar a un volumen persistente (ej. /app/keys/...)
# para que sobreviva a los redeploys.
gs.auth.keystore.path=${GS_KEYSTORE_PATH:file:./keys/gs-auth.p12}
gs.auth.keystore.password=${GS_KEYSTORE_PASSWORD:gs_keystore_2025}
gs.auth.keystore.alias=gs-auth
gs.auth.token-ttl-hours=${GS_TOKEN_TTL_HOURS:12}
# Refresh token (cookie separada, path acotado a /api/auth/refresh) — permite
# renovar el access token sin volver a pedir contraseña mientras dure. Pasado
# esto sí hay que loguearse de nuevo (no rota: sesión con techo real, no infinita).
gs.auth.refresh-ttl-days=${GS_REFRESH_TTL_DAYS:30}
# El JWT viaja en una cookie httpOnly (ver AuthController/CookieBearerTokenResolver).
# false SOLO para probar sin HTTPS en desarrollo local (ej. localhost por http) —
# en producción real siempre true, o el browser directamente no manda la cookie.
gs.auth.cookie-secure=${GS_COOKIE_SECURE:true}

# --- Seed inicial (module auth) ------------------------------------------------
GS_ADMIN_PASSWORD=${GS_ADMIN_PASSWORD:admin123}
GS_TECNICO_PASSWORD=${GS_TECNICO_PASSWORD:tecnico123}
GS_BOT_PEDIDOS_PASSWORD=${GS_BOT_PEDIDOS_PASSWORD:cambiar-en-produccion}

# --- Backup (disparo manual desde el panel, contenedor separado) -------------
BACKUP_URI=${BACKUP_URI:http://localhost:3002}
GS_INTERNAL_API_KEY=${GS_INTERNAL_API_KEY:gs-internal-key-cambiar-en-prod}

# --- MinIO (un bucket por dominio: finanzas guarda comprobantes, pedidos documentos/escaneos) ---
gs.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
gs.minio.access-key=${MINIO_ROOT_USER:minioadmin}
gs.minio.secret-key=${MINIO_ROOT_PASSWORD:minioadmin}
gs.minio.enabled=${MINIO_ENABLED:true}
gs.minio.bucket.finanzas=${MINIO_BUCKET_FINANZAS:comprobantes}
gs.minio.bucket.pedidos=${MINIO_BUCKET_PEDIDOS:documentos-pedidos}

# --- Bot de WhatsApp (proceso Node externo — sigue siendo un servicio aparte) ---
# gs.bot.api-key la usan finanzas (autentica lo que llega DEL bot) y pedidos
# (se autentica frente al bot al notificar) — mismo secreto compartido, como ya era.
gs.bot.api-key=${GS_BOT_API_KEY:gs-bot-dev-key-cambiar-en-prod}
gs.bot.uri=${BOT_URI:http://localhost:3001}

# --- Pedidos / Odontólogos ---------------------------------------------------
gs.pedidos.dias-limite-atraso=${GS_PEDIDOS_DIAS_LIMITE_ATRASO:6}
gs.odontologos.meses-inactividad=${GS_ODONTOLOGOS_MESES_INACTIVIDAD:6}

# --- Multipart (pedidos: escaneos 3D de varios MB; catalogo: fotos ~10MB) ----
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# --- Actuator ------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info

# --- Observabilidad: métricas y trazas por OTLP (Grafana Cloud u otro backend
# compatible) ------------------------------------------------------------------
# Todo detrás de UN solo interruptor (OTEL_ENABLED): sin credenciales reales
# (dev local, CI) queda apagado — con esto en true pero mal configurado no
# rompe el arranque, solo loguea reintentos fallidos de exportación en
# background. OTEL_EXPORTER_OTLP_ENDPOINT es la base del gateway OTLP de
# Grafana Cloud (ej: https://otlp-gateway-prod-sa-east-1.grafana.net/otlp);
# GRAFANA_OTLP_AUTH_HEADER es "Basic <base64(instanceId:apiToken)>" — ambos
# se sacan del panel de la stack en Grafana Cloud (Connections → OpenTelemetry).
management.otlp.metrics.export.enabled=${OTEL_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.otlp.metrics.export.headers.Authorization=${GRAFANA_OTLP_AUTH_HEADER:}
management.tracing.enabled=${OTEL_ENABLED:false}
# 1.0 = tracea el 100% de los requests — de sobra para el volumen de un solo
# laboratorio; bajarlo (ej. 0.1) solo si el volumen de trazas se vuelve un problema.
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLE_RATE:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.tracing.headers.Authorization=${GRAFANA_OTLP_AUTH_HEADER:}

# --- Logging ---------------------------------------------------------------
# Formato (consola legible vs JSON estructurado) según el perfil — ver
# logback-spring.xml. Los logs no viajan por OTLP: en producción se ingestan
# vía el driver de logging "loki" de Docker (ver docker-compose.observability.yml),
# no desde acá — el JSON ya trae traceId/spanId para correlacionar con las
# trazas de arriba.
logging.level.com.gs=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
