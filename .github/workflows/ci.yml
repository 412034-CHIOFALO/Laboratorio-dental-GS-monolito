name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - name: Compilar y correr tests unitarios
        run: mvn -B clean verify

      # El bot de WhatsApp: parsers, OCR de comprobantes (imágenes de prueba), cola de avisos y teléfonos.
      # No necesita WhatsApp ni Chromium: PUPPETEER_SKIP_DOWNLOAD evita bajarlo.
      - name: Tests del bot de WhatsApp
        working-directory: bot
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Crear los 5 schemas (equivalente al init-schemas.sql de producción)
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS gs_auth;
            CREATE DATABASE IF NOT EXISTS gs_catalogo;
            CREATE DATABASE IF NOT EXISTS gs_stock;
            CREATE DATABASE IF NOT EXISTS gs_finanzas;
            CREATE DATABASE IF NOT EXISTS gs_pedidos;
            CREATE USER IF NOT EXISTS 'gs_ci'@'%' IDENTIFIED BY 'ci-db-password';
            GRANT ALL PRIVILEGES ON gs_auth.* TO 'gs_ci'@'%';
            GRANT ALL PRIVILEGES ON gs_catalogo.* TO 'gs_ci'@'%';
            GRANT ALL PRIVILEGES ON gs_stock.* TO 'gs_ci'@'%';
            GRANT ALL PRIVILEGES ON gs_finanzas.* TO 'gs_ci'@'%';
            GRANT ALL PRIVILEGES ON gs_pedidos.* TO 'gs_ci'@'%';
          "

      - name: Empaquetar
        run: mvn -B -DskipTests package

      # Smoke test: esto es lo que "mvn compile" NO puede detectar — colisiones
      # de nombre de bean entre módulos, un @Order mal puesto, un securityMatcher
      # que deja una ruta sin cubrir, etc. Solo aparecen al levantar el
      # ApplicationContext real contra una base de datos real.
      - name: Levantar la app, verificar que bootea y correr el flujo completo (E2E)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: gs_auth
          # Sin perfil "dev" corre SecretosProduccionValidator: arranca igual que
          # en producción, así que necesita secretos que no sean los defaults
          # (ni de menos de 8 caracteres — por eso no usa root/root).
          DB_USERNAME: gs_ci
          DB_PASSWORD: ci-db-password
          MINIO_ENABLED: "false"
          GS_ADMIN_PASSWORD: ci-admin-password
          GS_TECNICO_PASSWORD: ci-tecnico-password
          GS_BOT_PEDIDOS_PASSWORD: ci-bot-pedidos-password
          GS_INTERNAL_API_KEY: ci-internal-api-key
          GS_BOT_API_KEY: ci-bot-api-key-0001
          GS_KEYSTORE_PASSWORD: ci-keystore-password
        run: |
          JAR=$(ls target/monolito-*.jar)
          java -jar "$JAR" &
          APP_PID=$!

          ok=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              ok=true
              break
            fi
            sleep 2
          done

          if [ "$ok" = true ]; then
            echo "OK: la app levantó sin colisiones de bean ni errores de arranque."
            # Flujo completo por la API real (sesión/CSRF, pedido -> stock -> entrega -> cobro, permisos
            # por rol, bot con anti-duplicados). Ver e2e/flujo_principal.py.
            e2e=0
            python3 e2e/flujo_principal.py --base http://localhost:8080 || e2e=$?
            kill "$APP_PID" 2>/dev/null || true
            exit $e2e
          else
            kill "$APP_PID" 2>/dev/null || true
            echo "La app no respondió a tiempo en /actuator/health — revisar logs del step anterior."
            exit 1
          fi
