name: CD

# Se dispara al mergear a master: corre los tests y, si pasan, arma las
# imágenes de backend/frontend y las sube a ghcr.io (tags "latest" y el SHA
# del commit). Nada de esto toca el servidor real — no hay ningún paso de
# deploy automático a propósito, porque el servidor (un laboratorio) no está
# prendido 24/7 y el dueño prefiere manejar el pull/up él mismo, cuando
# quiere y desde donde quiere.
#
# Deploy manual, en el servidor, cuando esté prendido y quieras actualizar
# (ver PRODUCCION.md para el setup inicial completo):
#   cd /opt/gs-monolito
#   docker compose -f docker-compose.yml -f docker-compose.https.yml pull app frontend
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d app frontend
#   docker image prune -f
#
# El secret VPS_SSH_KEY (y VPS_HOST/VPS_USER) quedan guardados en el repo sin
# uso por ahora — no hace falta borrarlos, no molestan estando ahí.

on:
  push:
    branches: [master]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Correr tests antes de desplegar
        run: mvn -B clean verify

  build-and-push:
    needs: test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - nombre: backend
            context: .
            sufijo: ""
          - nombre: frontend
            context: ./frontend
            sufijo: "-frontend"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nombre de imagen (ghcr exige minúsculas)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')${{ matrix.sufijo }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: "Build y push de la imagen: ${{ matrix.nombre }}"
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}
