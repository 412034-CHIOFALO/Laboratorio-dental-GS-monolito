name: CD

# Se dispara al mergear a master. Requiere estos secrets en el repo
# (Settings > Secrets and variables > Actions):
#   VPS_HOST      IP o dominio del servidor
#   VPS_USER      usuario SSH
#   VPS_SSH_KEY   clave privada SSH (la pública debe estar en el servidor)
# GITHUB_TOKEN ya existe automáticamente, no hace falta crearlo.
#
# Requiere que en el VPS ya exista /opt/gs-monolito con docker-compose.yml,
# docker-compose.https.yml y .env configurados, y que ./init-letsencrypt.sh
# ya se haya corrido una vez a mano (ver PRODUCCION.md — setup inicial, una
# sola vez). Sin -f docker-compose.https.yml en el deploy de abajo, cada push
# volvería a levantar "frontend" sin HTTPS (sin puerto 443, sin DOMAIN, sin
# los volúmenes del certificado).

on:
  push:
    branches: [master]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Correr tests antes de desplegar
        run: mvn -B clean verify

  build-and-push:
    needs: test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - nombre: backend
            context: .
            sufijo: ""
          - nombre: frontend
            context: ./frontend
            sufijo: "-frontend"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nombre de imagen (ghcr exige minúsculas)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')${{ matrix.sufijo }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: "Build y push de la imagen: ${{ matrix.nombre }}"
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en el VPS por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/gs-monolito
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.https.yml"
            $COMPOSE pull app frontend
            $COMPOSE up -d app frontend
            docker image prune -f
