# Headers de seguridad comunes a los 2 templates de nginx (HTTP y HTTPS).
#
# Van en un archivo aparte porque nginx NO hereda los add_header del "server"
# dentro de un "location" que define los suyos: basta un add_header Cache-Control
# en "location = /index.html" para que el HTML —justo lo que más importa
# proteger— salga sin nada de esto. Por eso cada "location" que usa add_header
# tiene que repetir este include.
#
# "always" para que se manden también en las respuestas 4xx/5xx.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# fonts.googleapis.com/gstatic.com: la app carga Inter/JetBrains Mono de Google
# Fonts (ver index.html/styles.css). images.unsplash.com: fotos de stock en la
# landing. media-src 'self': el <video> de instagram/ que sirve esta misma nginx.
# blob:: el visor 3D (three.js STLLoader/OBJLoader) hace fetch() de una URL
# blob: (connect-src), los thumbnails de documentos son <img src="blob:...">
# (img-src) y los PDF se abren con window.open(blob:) (object-src).
# script-src 'self' (sin 'unsafe-inline'): por eso angular.json desactiva
# inlineCritical — su truco del <link media="print" onload="..."> es un handler
# inline y la CSP lo bloquearía, dejando la app sin estilos — y no hay que
# escribir onerror="..."/onclick="..." en los templates (usar (error)="...").
# El backend (SecurityHeaders.java) manda una CSP más estricta porque lo único
# que sirve como HTML ahí es Swagger, sin estas dependencias externas.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com; media-src 'self'; connect-src 'self' blob:; frame-ancestors 'self'; object-src blob:; base-uri 'self'; form-action 'self'" always;
