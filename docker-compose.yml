# Sirve para dos casos, gracias a que "app" y "frontend" declaran build Y
# image al mismo tiempo:
#
#   - DESARROLLO LOCAL: `docker compose up --build` compila todo desde el
#     código fuente de este repo (backend + frontend + bot) y levanta el sistema
#     completo (frontend + monolito + mysql + minio + bot) con un solo comando —
#     sin tocar ni levantar nada del repo viejo de microservicios.
#   - PRODUCCIÓN (VPS): vive en /opt/gs-monolito/docker-compose.yml. El
#     pipeline de CD no reconstruye nada acá — solo hace
#     `docker compose pull && docker compose up -d` contra las imágenes ya
#     armadas en ghcr.io.
#
# Setup inicial en el VPS (una sola vez) — ver PRODUCCION.md para la versión
# completa y comentada:
#   1. Copiar este repo al servidor (incluye docker-entrypoint-initdb.d/,
#      docker-compose.https.yml e init-letsencrypt.sh).
#   2. Copiar .env.example a .env y completar los valores reales (incluye
#      DOMAIN y LETSENCRYPT_EMAIL, nuevos, para el HTTPS de abajo).
#   3. DNS del dominio ya apuntando al IP del VPS, y ./init-letsencrypt.sh
#      corrido una vez (pide el primer certificado real).
#   4. docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
#      (sumar -f docker-compose.observability.yml si ya se configuró Grafana
#      Cloud — ver PRODUCCION.md).

services:
  app:
    build: .
    image: ${GS_IMAGE:-ghcr.io/412034-chiofalo/laboratorio-dental-gs-monolito:latest}
    restart: unless-stopped
    # Sin puerto público a propósito: nginx ("frontend") ya proxyea /api/ por
    # la red interna de Docker. Exponer 8080 acá dejaría la API alcanzable
    # directo por HTTP plano, esquivando el HTTPS/headers de seguridad de
    # nginx por completo (ver docker-compose.https.yml).
    env_file:
      - .env
    environment:
      # Nombre del servicio del bot en la red interna de Docker (el mismo que usa
      # nginx para /api/bot/). Pisa cualquier BOT_URI viejo que haya quedado en .env.
      BOT_URI: http://gs-bot:3001
    volumes:
      # Keystore RSA persistente: se genera una sola vez (primer arranque) y se
      # reusa en cada rebuild/redeploy. Sin esto, cada deploy regeneraba la
      # clave y invalidaba TODOS los JWT ya emitidos (deslogueaba a todos).
      - app_keys:/app/keys
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build: ./frontend
    image: ${GS_FRONTEND_IMAGE:-ghcr.io/412034-chiofalo/laboratorio-dental-gs-monolito-frontend:latest}
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      GS_BOT_API_KEY: ${GS_BOT_API_KEY:-gs-bot-dev-key-cambiar-en-prod}
    depends_on:
      app:
        condition: service_healthy

  mysql:
    # Pinneado a un patch real (no "8.0" flotante) — Dependabot lo mantiene al
    # día (ver .github/dependabot.yml).
    image: mysql:8.0.46
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      # Leídas por docker-entrypoint-initdb.d/init-schemas.sh para crear el
      # usuario de aplicación con privilegios acotados a los 5 schemas gs_*
      # (la app nunca se conecta como root — ver .env.example).
      GS_APP_DB_USER: ${DB_USERNAME:-gs_app}
      GS_APP_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # ATENCIÓN: minio/minio dejó de publicarse — el repo community/open-source
    # de MinIO está archivado desde abril 2026 (relicenciaron y frenaron la
    # distribución en octubre 2025), así que esta imagen ya no recibe parches
    # de seguridad de ningún tipo, se pinnee la versión que se pinnee. Se fija
    # acá al último tag conocido en vez de "latest" para que el pull sea
    # reproducible, pero esto no resuelve el problema de fondo — en algún
    # momento conviene evaluar migrar a una alternativa mantenida (Garage,
    # SeaweedFS) o a un S3 gestionado. Decisión aparte, no se resuelve acá.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    # Sin puertos públicos a propósito: "app" es el único que habla con MinIO
    # (por la red interna de Docker, gs.minio.endpoint=http://minio:9000) —
    # todo archivo se sube/baja como stream a través del backend, nunca con
    # una URL directa al browser, así que no hace falta exponer ni el puerto
    # de la API (9000) ni el de la consola de administración (9001). Para
    # entrar a la consola desde el VPS: túnel SSH, ver PRODUCCION.md.

  # Backup diario 3 AM → Google Drive (dumps de las 5 bases + archivos de
  # MinIO) + disparo manual desde el botón del panel. Ver backup/README.md
  # para la config de rclone (una sola vez, en el VPS).
  backup:
    build: ./backup
    init: true   # crond como PID 1 sin esto tira "setpgid: Operation not permitted"
    environment:
      # El backup sí necesita root: mysqldump lee las 5 bases completas y
      # además inserta directo en auditoria_eventos (ver backup/backup.sh).
      # No es el hallazgo que se resuelve acá — ese es el usuario de runtime
      # de la app (ver servicio "mysql" y "app" más abajo).
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      BACKUP_TRIGGER_KEY: ${GS_INTERNAL_API_KEY:-gs-internal-key-cambiar-en-prod}
    volumes:
      - minio_data:/minio_data:ro
      # Directorio, no el archivo directo: rclone reescribe su config al
      # refrescar el token OAuth (rename atómico), y eso rompe con
      # "device or resource busy" si el archivo está bind-mounteado solo.
      - ./backup/rclone-config:/root/.config/rclone
      - backup_tmp:/backups/tmp
      # Copias locales de los backups (se ven en el servidor como ./backups, aunque no haya Google Drive)
      - ./backups:/backups/local
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  # Bot de WhatsApp (Node + Chromium headless, ver bot/README.md). El nombre
  # "gs-bot" no es casual: nginx proxyea /api/bot/ a gs-bot:3001 y el monolito
  # le manda las notificaciones ahí (BOT_URI de "app"). La sesión de WhatsApp
  # se guarda en el volumen wpp_auth: el QR se escanea UNA sola vez, desde
  # la pantalla "Bot WhatsApp" del panel → Estado del bot (o con
  # `docker compose logs -f gs-bot`).
  gs-bot:
    build: ./bot
    image: ${GS_BOT_IMAGE:-ghcr.io/412034-chiofalo/laboratorio-dental-gs-monolito-bot:latest}
    restart: unless-stopped
    environment:
      TZ: America/Argentina/Cordoba
      BACKEND_URL: http://app:8080
      BACKEND_ENABLED: ${BOT_BACKEND_ENABLED:-true}
      # Tiene que ser la misma key que usan "app" (vía .env) y "frontend".
      BOT_API_KEY: ${GS_BOT_API_KEY:-gs-bot-dev-key-cambiar-en-prod}
      GRUPOS: ${BOT_GRUPOS:-Comprobantes Transferencias,Comprobantes Efectivo}
      GRUPOS_EFECTIVO: ${BOT_GRUPOS_EFECTIVO:-Comprobantes Efectivo}
      GRUPOS_JIDS: ${BOT_GRUPOS_JIDS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    # Liveness del servidor HTTP del bot (no de la conexión a WhatsApp). Usa
    # node porque la imagen slim no trae wget/curl.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/bot/estado',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      - wpp_auth:/app/.wwebjs_auth
    depends_on:
      app:
        condition: service_healthy

volumes:
  mysql_data:
  minio_data:
  app_keys:
  backup_tmp:
  wpp_auth:
